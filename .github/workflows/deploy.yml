name: Deploy React ke GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v5

      - name: Siapkan Bun (Sesuai Google AI Studio)
        uses: oven-sh/setup-bun@v2

      - name: Install & Build React
        run: |
          bun install
          bun x vite build --base=./

      - name: Konfigurasi GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Hasil Build
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
